{% extends 'base.html' %}{% block content %}<section class='enterprise-hero'><div class='eyebrow'>OWL FINANCE · ENTERPRISE 7.0</div><h1>Branch management</h1><p>Secure operational controls · by OWL STORE</p></section><div class='enterprise-content'><form class="enterprise-form" method="post" action="{{url_for('enterprise.branches')}}"><input type="hidden" name="csrf" value="{{csrf}}"><label>Branch code<input name="code" type="text" placeholder="Branch code" required></label><label>Branch name<input name="name" type="text" placeholder="Branch name" required></label><label>City / location<input name="location" type="text" placeholder="City / location" required></label><button>Create branch</button></form><h2>Branches</h2><div class="enterprise-list">{% for b in branches %}<article><b>{{b.code}} · {{b.name}}</b><small>{{b.location}}</small></article>{% else %}<p>No branches yet</p>{% endfor %}</div></div>{% endblock %}
